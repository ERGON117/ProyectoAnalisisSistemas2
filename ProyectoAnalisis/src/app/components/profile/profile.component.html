<!-- src/app/components/profile/profile.component.html -->
<div class="container">
  <h2>Perfil de Usuario</h2>
  <div *ngIf="user">
    <p><strong>Nombre:</strong> {{user.nombre}}</p>
    <p><strong>Correo:</strong> {{user.correoElectronico}}</p>
    <p><strong>Rol:</strong> {{user.role.nombre}}</p>
    <button (click)="togglePasswordForm()">
      {{showPasswordForm ? 'Cancelar' : 'Cambiar Contraseña'}}
    </button>
  </div>

  <div *ngIf="showPasswordForm" class="password-form">
    <h3>Cambiar Contraseña</h3>
    <form (ngSubmit)="onSubmitPassword()">
      <div class="form-group">
        <label>Contraseña Actual</label>
        <input type="password" [(ngModel)]="changePasswordRequest.currentPassword"
               name="currentPassword" required>
      </div>
      <div class="form-group">
        <label>Nueva Contraseña</label>
        <input type="password" [(ngModel)]="changePasswordRequest.newPassword"
               name="newPassword" required>
      </div>
      <div class="error" *ngIf="errorMessage">{{errorMessage}}</div>
      <div class="success" *ngIf="successMessage">{{successMessage}}</div>
      <button type="submit">Cambiar Contraseña</button>
    </form>
  </div>
</div>
