<!-- Cambio: Crear una barra de navegación horizontal con menús desplegables -->
<nav class="navbar">
  <ul class="nav-list">
    <!-- Cambio: Iterar sobre módulos como elementos principales del menú -->
    <li *ngFor="let modulo of menus" class="nav-item">
      <span class="nav-link">{{ modulo.nombre }}</span>
      <!-- Cambio: Menú desplegable para cada módulo -->
      <ul class="dropdown">
        <!-- Cambio: Iterar sobre los menús dentro de cada módulo -->
        <li *ngFor="let menu of modulo.menuItems" class="dropdown-item">
          <span class="dropdown-link">{{ menu.nombre }}</span>
          <!-- Cambio: Submenú desplegable para las opciones de cada menú -->
          <ul class="sub-dropdown">
            <li *ngFor="let opcion of menu.opciones" (click)="navigateTo(opcion.pagina)" class="sub-dropdown-item">
              {{ opcion.nombre }}
              <span *ngIf="opcion.alta"></span>
              <span *ngIf="opcion.baja"> </span>
              <span *ngIf="opcion.cambio"></span>
              <span *ngIf="opcion.imprimir"></span>
              <span *ngIf="opcion.exportar"></span>
            </li>
          </ul>
        </li>
      </ul>
    </li>
    <!-- Cambio: Integrar botones de Perfil y Cerrar Sesión en la barra de navegación -->
    <li class="nav-item">
      <span class="nav-link" (click)="navigateToProfile()">Perfil</span>
    </li>
    <li class="nav-item">
      <span class="nav-link" (click)="logout()">Cerrar Sesión</span>
    </li>
  </ul>
</nav>
