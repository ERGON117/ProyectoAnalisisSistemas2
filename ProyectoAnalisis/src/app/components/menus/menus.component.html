<!-- src/app/components/menus/menus.component.html -->
<div class="container my-5">
  <h2 class="mb-4 text-primary fw-bold">Gestión de Menús</h2>
  <div *ngIf="opcion; else noOpcion">
    <div class="alert alert-danger alert-dismissible fade show" *ngIf="errorMessage" role="alert">
      {{errorMessage}}
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Botones para imprimir y exportar -->
    <div class="d-flex justify-content-end mb-4">
      <button *ngIf="opcion.imprimir" class="btn btn-outline-primary me-2" (click)="print()">
        <i class="bi bi-printer me-1"></i> Imprimir
      </button>
      <button *ngIf="opcion.exportar" class="btn btn-outline-success" (click)="exportData()">
        <i class="bi bi-file-earmark-spreadsheet me-1"></i> Exportar a CSV
      </button>
    </div>

    <!-- Tabla de menús -->
    <div class="card shadow-sm border-0">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover table-bordered mb-0">
            <thead class="table-dark">
              <tr>
                <th scope="col">ID Menú</th>
                <th scope="col">Nombre</th>
                <th scope="col">Orden Menú</th>
                <th scope="col">Módulo</th>
                <th scope="col" *ngIf="opcion.cambio || opcion.baja">Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let item of items">
                <td>{{item.idMenu}}</td>
                <td>{{item.nombre}}</td>
                <td>{{item.ordenMenu}}</td>
                <td>{{item.modulo?.nombre || 'Sin módulo'}}</td>
                <td *ngIf="opcion.cambio || opcion.baja" class="text-center">
                  <div class="btn-group" role="group">
                    <button *ngIf="opcion.cambio" class="btn btn-outline-warning btn-sm me-1" (click)="editItem(item)">
                      <i class="bi bi-pencil-square me-1"></i> Modificar
                    </button>
                    <button *ngIf="opcion.baja" class="btn btn-outline-danger btn-sm" (click)="deleteItem(item.idMenu)">
                      <i class="bi bi-trash me-1"></i> Eliminar
                    </button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Formulario unificado para alta y cambio -->
    <div *ngIf="opcion.alta || opcion.cambio" class="card shadow-sm border-0 mt-4">
      <div class="card-header bg-primary text-white">
        <h3 class="mb-0">{{ isEdit ? 'Modificar Menú' : 'Alta de Menú' }}</h3>
      </div>
      <div class="card-body">
        <form (ngSubmit)="submitForm()">
          <div class="row g-3">
            <div class="col-md-6">
              <div class="mb-3" *ngIf="isEdit">
                <label for="idMenu" class="form-label fw-bold">ID Menú</label>
                <input type="text" class="form-control" id="idMenu" [(ngModel)]="formItem.idMenu" name="idMenu" readonly required>
              </div>
              <div class="mb-3">
                <label for="nombre" class="form-label fw-bold">Nombre</label>
                <input type="text" class="form-control" id="nombre" [(ngModel)]="formItem.nombre" name="nombre" required>
              </div>
              <div class="mb-3">
                <label for="moduloId" class="form-label fw-bold">Módulo</label>
                <select class="form-select" id="moduloId" [(ngModel)]="formItem.modulo.idModulo" name="moduloId" required>
                  <option value="">Selecciona un módulo</option>
                  <option *ngFor="let modulo of modulos" [value]="modulo.idModulo">
                    {{modulo.nombre}}
                  </option>
                </select>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label for="ordenMenu" class="form-label fw-bold">Orden Menú</label>
                <input type="number" class="form-control" id="ordenMenu" [(ngModel)]="formItem.ordenMenu" name="ordenMenu" min="0" required>
              </div>
            </div>
          </div>
          <div class="d-flex justify-content-end mt-3">
            <button type="submit" class="btn btn-primary me-2">
              <i class="bi bi-save me-1"></i> {{ isEdit ? 'Actualizar' : 'Agregar' }}
            </button>
            <button type="button" class="btn btn-outline-secondary" (click)="resetForm()">
              <i class="bi bi-x-circle me-1"></i> Cancelar
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <ng-template #noOpcion>
    <div class="alert alert-warning mt-4" role="alert">
      No tienes permisos para esta sección.
    </div>
  </ng-template>
</div>
