<!-- src/app/components/change-password/change-password.component.html -->
<div class="container">
  <h2>Cambiar Contraseña</h2>
  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Contraseña Actual</label>
      <input type="password" [(ngModel)]="changePasswordRequest.currentPassword" name="currentPassword" required>
    </div>
    <div class="form-group">
      <label>Nueva Contraseña</label>
      <input type="password" [(ngModel)]="changePasswordRequest.newPassword" name="newPassword" required>
    </div>
    <div class="error" *ngIf="errorMessage">{{errorMessage}}</div>
    <div class="success" *ngIf="successMessage">{{successMessage}}</div>
    <button type="submit">Cambiar Contraseña</button>
  </form>
</div>
