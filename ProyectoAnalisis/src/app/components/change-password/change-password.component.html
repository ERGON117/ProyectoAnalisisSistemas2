<div class="container">
  <h2>Cambiar Contraseña</h2>
  <form (ngSubmit)="onSubmit()">
    <div class="form-group" [class.error]="!changePasswordRequest.correoElectronico && missingFields.length > 0">
      <label>Correo Electrónico</label>
      <input type="email" [(ngModel)]="changePasswordRequest.correoElectronico" name="correoElectronico" required>
    </div>
    <div class="form-group" [class.error]="!changePasswordRequest.currentPassword && missingFields.length > 0">
      <label>Contraseña Actual</label>
      <input type="password" [(ngModel)]="changePasswordRequest.currentPassword" name="currentPassword" required>
    </div>
    <div class="form-group" [class.error]="!changePasswordRequest.newPassword && missingFields.length > 0">
      <label>Nueva Contraseña</label>
      <input type="password" [(ngModel)]="changePasswordRequest.newPassword" name="newPassword" required>
    </div>
    <div class="error" *ngIf="errorMessage">{{errorMessage}}</div>
    <div class="success" *ngIf="successMessage">{{successMessage}}</div>
    <button type="submit">Cambiar Contraseña</button>
    <p><a [routerLink]="['/login']" [relativeTo]="null">Volver al inicio de sesión</a></p>
  </form>
</div>
