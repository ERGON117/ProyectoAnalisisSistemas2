<div class="container">
  <h2>Restablecer Contraseña</h2>
  <div class="form-group">
    <label>Correo Electrónico</label>
    <input type="email" [(ngModel)]="resetRequest.correoElectronico" name="correoElectronico" required>
    <button type="button" (click)="getSecurityQuestion()">Obtener Pregunta</button>
  </div>
  <div *ngIf="showResetForm">
    <div class="form-group">
      <label>Pregunta de Seguridad</label>
      <p>{{ securityQuestion }}</p>
    </div>
    <form (ngSubmit)="onSubmit()">
      <div class="form-group" [class.error]="!resetRequest.respuesta && missingFields.length > 0">
        <label>Respuesta</label>
        <input type="text" [(ngModel)]="resetRequest.respuesta" name="respuesta" required>
      </div>
      <div class="form-group" [class.error]="!resetRequest.newPassword && missingFields.length > 0">
        <label>Nueva Contraseña</label>
        <input type="password" [(ngModel)]="resetRequest.newPassword" name="newPassword" required>
      </div>
      <div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>
      <div class="success" *ngIf="successMessage">{{ successMessage }}</div>
      <button type="submit">Restablecer Contraseña</button>
    </form>
  </div>
  <p><a [routerLink]="['/login']">Volver al inicio de sesión</a></p>
</div>
